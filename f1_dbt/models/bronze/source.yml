version: 2

sources:
    - name: bronze
      database: f1_championship
      schema: "{{ var('bronze_schema') }}"
      tables:
        - name: bronze_circuits
          description: "This table contains information about the circuits used in the Formula 1 championship, including their names, locations, and other relevant details."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/circuits.csv"
        - name: bronze_constructor_results
          description: "This table contains information about the constructor results in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/constructor_results.csv"
        - name: bronze_constructors
          description: "This table contains information about the constructors in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/constructors.csv"
        - name: bronze_driver_standings
          description: "This table contains information about the driver standings in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/driver_standings.csv"
        - name: bronze_drivers
          description: "This table contains information about the drivers in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/drivers.csv"
        - name: bronze_lap_times
          description: "This table contains information about the lap times of drivers in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/lap_times.csv"
        - name: bronze_pit_stops
          description: "This table contains information about the pit stops of drivers in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/pit_stops.csv"
        - name: bronze_qualifyings
          description: "This table contains information about the qualifying results in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/qualifying.csv"
        - name: bronze_races
          description: "This table contains information about the races in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/races.csv"
        - name: bronze_results
          description: "This table contains information about the results of races in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/results.csv"   
        - name: bronze_seasons
          description: "This table contains information about the seasons in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/seasons.csv"
        - name: bronze_sprint_results
          description: "This table contains information about the sprint results in the Formula 1 championship."
          config:
            meta:
              source_volume: "{{ var('source_volume') }}/{{ var('source_schema') }}/{{ var('source_volume') }}/sprint_results.csv"